# LiveKit Server — Production Config
# Keys are passed via the --keys CLI flag in docker-compose so they stay out of this file.
# Set LIVEKIT_API_KEY / LIVEKIT_API_SECRET in docker/.env

port: 7880

# Redis — required for egress worker coordination
redis:
  address: redis:6379

rtc:
  tcp_port: 7881
  # UDP port range for WebRTC media — open this range in your firewall / cloud security list
  port_range_start: 50000
  port_range_end: 60000
  # Detect the public IP automatically (required on Oracle Cloud / any NAT environment)
  use_external_ip: true

# Built-in TURN server (handles NAT traversal — required for mobile / corporate networks)
turn:
  enabled: true
  # ladyfinger.ca resolves to this server's public IP (155.248.218.193)
  domain: ladyfinger.ca
  udp_port: 3478
  tls_port: 5349
  # TLS terminated by nginx upstream — LiveKit sees plain TCP on 5349
  external_tls: true

logging:
  level: info
  json: true

# Webhook: notifies the API when rooms start/end and egress completes.
# The actual URL is injected via the LIVEKIT_WEBHOOK_URLS env var in docker-compose
# so this file stays domain-agnostic.
webhook:
  api_key: ""
  urls: []
