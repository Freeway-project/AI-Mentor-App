# LiveKit Server — Production Config
# Fill in your domain below, then set LIVEKIT_API_KEY / LIVEKIT_API_SECRET in docker/.env
# Keys are passed via the --keys CLI flag in docker-compose so they stay out of this file.

port: 7880

rtc:
  tcp_port: 7881
  # UDP port range for WebRTC media streams — open this range in Oracle Cloud Security List
  port_range_start: 50000
  port_range_end: 60000
  # Detect the public IP automatically (required on Oracle Cloud — don't set use_external_ip: false)
  use_external_ip: true

# Built-in TURN server (handles NAT traversal — required for mobile/corporate networks)
turn:
  enabled: true
  # Set this to the domain that resolves to this server's public IP
  domain: livekit.yourdomain.com
  udp_port: 3478
  tls_port: 5349
  # TLS is terminated by nginx upstream — LiveKit sees plain TCP on 5349
  external_tls: true

logging:
  level: info
  json: true

# Webhook: notifies the API when rooms start/end and egress completes
# Set API_WEBHOOK_URL in docker/.env (e.g. https://api.yourdomain.com)
webhook:
  api_key: ""  # leave blank — LiveKit signs webhooks with the API key passed via --keys
  urls: []     # override via LIVEKIT_WEBHOOK_URLS env var in docker-compose
