# Run from repo root:
#   docker compose -f docker/docker-compose.yml up -d --build
#
# Copy docker/.env.example → docker/.env and fill in your values first.

name: owl-mentors

services:

  # ── Redis — LiveKit server ↔ egress worker coordination ──────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── MinIO (S3-compatible object storage) ─────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console  →  http://<host>:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO bucket bootstrap ────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb -p local/$$MINIO_BUCKET || true &&
        mc anonymous set download local/$$MINIO_BUCKET || true
      "

  # ── LiveKit server ────────────────────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      # Webhook URL injected here so livekit.yaml stays domain-agnostic
      LIVEKIT_WEBHOOK_URLS: ${API_WEBHOOK_URL}/api/webhooks/livekit
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    command: >
      --config /etc/livekit.yaml
      --keys "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    ports:
      - "7880:7880"              # WebSocket signaling (proxied by nginx → wss://ladyfinger.ca:7443)
      - "7881:7881/tcp"          # TCP media fallback
      - "3478:3478/udp"          # TURN UDP (NAT traversal)
      - "5349:5349/tcp"          # TURN TLS
      - "50000-60000:50000-60000/udp"  # WebRTC RTP media range

  # ── LiveKit Egress — records rooms to MinIO ───────────────────────────────
  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      EGRESS_CONFIG_FILE: /etc/livekit/egress.yaml
    volumes:
      - ./egress.yaml:/etc/livekit/egress.yaml:ro
    cap_add:
      - SYS_ADMIN   # required for Chrome sandbox inside egress container

  # ── API ───────────────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      livekit:
        condition: service_started
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
      BETTERSTACK_SOURCE_TOKEN: ${BETTERSTACK_SOURCE_TOKEN}
      BETTERSTACK_INGESTING_URL: ${BETTERSTACK_INGESTING_URL:-https://in.logs.betterstack.com}
      BETTERSTACK_SERVICE: ${BETTERSTACK_SERVICE:-owl-mentors-api}
      BETTERSTACK_MIN_LEVEL: ${BETTERSTACK_MIN_LEVEL:-info}
    ports:
      - "6001:3001"

  # ── Vector — container logs + VPS metrics → BetterStack ──────────────────
  vector:
    image: timberio/vector:0.42-alpine
    restart: unless-stopped
    user: "0"
    volumes:
      - ./vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - vector-data:/var/lib/vector
    environment:
      BETTERSTACK_LOGS_TOKEN: ${BETTERSTACK_LOGS_TOKEN}
      BETTERSTACK_METRICS_TOKEN: ${BETTERSTACK_METRICS_TOKEN}
      PROCFS_ROOT: /host/proc
      SYSFS_ROOT: /host/sys

volumes:
  minio-data:
  vector-data:
