name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.0"

      - name: Cache node_modules
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

  type-check:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.0"

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ hashFiles('bun.lock') }}

      - name: Type check all workspaces
        run: bun run type-check

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.0"

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ hashFiles('bun.lock') }}

      - name: Lint web app
        run: bun run --filter @owl-mentors/web lint

  smoke-api:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3001
      JWT_SECRET: ci-smoke-secret
      JWT_EXPIRES_IN: 7d
      MONGODB_URI: mongodb://127.0.0.1:27017/mentor-app-smoke
      MONGODB_DB_NAME: mentor-app-smoke
      ALLOWED_ORIGINS: http://localhost:3000
      SMOKE_BASE_URL: http://127.0.0.1:3001
      SMOKE_MODE: local
      SMOKE_ALLOW_WRITES: true
      SMOKE_ADMIN_EMAIL: admin@owlmentor.com
      SMOKE_ADMIN_PASSWORD: Admin@123456
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.0"

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ hashFiles('bun.lock') }}

      - name: Start API server
        run: |
          bun apps/api/src/server.ts > /tmp/owl-api.log 2>&1 &
          echo $! > /tmp/owl-api.pid

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become healthy"
          cat /tmp/owl-api.log
          exit 1

      - name: Seed admin
        run: bun apps/api/src/scripts/seed-admin.ts

      - name: Run API smoke test
        run: bun run smoke:api

      - name: Show API log
        if: always()
        run: cat /tmp/owl-api.log

  smoke-api-hosted-main:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.0"

      - name: Run hosted backend smoke test
        env:
          SMOKE_BASE_URL: https://ladyfinger.ca/owl-api
          SMOKE_MODE: remote
          SMOKE_ALLOW_WRITES: false
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
        run: |
          test -n "$SMOKE_BASE_URL"
          test -n "$SMOKE_ADMIN_EMAIL"
          test -n "$SMOKE_ADMIN_PASSWORD"
          bun apps/api/scripts/smoke-test.ts

  build-api:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.0"

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ hashFiles('bun.lock') }}

      - name: Build API
        run: bun run --filter @owl-mentors/api build

  build-web:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.0"

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ hashFiles('bun.lock') }}

      - name: Build web app
        run: bun run --filter @owl-mentors/web build
